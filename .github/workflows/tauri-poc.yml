name: Tauri PoC Build

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated Tauri NSIS installer"
        required: false
        default: false
        type: boolean

jobs:
  tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Tauri tests
        run: npm test -- apps/tauri-desktop/test/tauriConfig.test.ts apps/tauri-desktop/test/sidecarBinary.test.ts apps/tauri-desktop/test/sidecarProtocol.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Build Tauri NSIS installer
        run: npm run tauri:build

      - name: Print Tauri artifact sizes
        shell: pwsh
        run: |
          $paths = @(
            "apps/tauri-desktop/src-tauri/target/release/hwpx-tauri-desktop.exe",
            "apps/tauri-desktop/src-tauri/target/release/hwpx-sidecar.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              $item = Get-Item $path
              "{0}`t{1:N0} bytes" -f $item.FullName, $item.Length
            }
          }
          Get-ChildItem "apps/tauri-desktop/src-tauri/target/release/bundle" -Recurse -File |
            Sort-Object FullName |
            ForEach-Object { "{0}`t{1:N0} bytes" -f $_.FullName, $_.Length }

      - name: Upload installer artifact
        if: inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-tauri-nsis
          path: apps/tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
