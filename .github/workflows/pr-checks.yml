name: PR Checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.21.0"]
    env:
      HWPX_OPT_CORPUS_SAMPLES: ""
      HWPX_OPT_SMOKE_INPUT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows binary fixtures for portable package tests
        run: node scripts/prepare-win-sharp-runtime.mjs

      - name: Check repository hygiene
        run: npm run release:hygiene

      - name: Test
        run: npm test -- --maxWorkers=2

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run synthetic regression corpus
        run: npm run quality:corpus

      - name: Run Linux Electron smoke with synthetic documents
        run: npm run desktop:smoke:built

  windows-cli:
    name: Windows native / portable CLI
    uses: ./.github/workflows/cli-portable-release.yml
    with:
      upload_artifact: false
