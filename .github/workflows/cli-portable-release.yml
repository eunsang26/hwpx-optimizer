name: CLI Portable Windows ZIP

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: "Upload generated CLI artifacts only when explicitly requested"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated CLI portable release artifacts"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cli-portable-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CLI portable Windows release gate
        run: npm run release:check:cli-portable:ci

      - name: Write synthetic smoke sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/ci-smoke | Out-Null
          node scripts/cli-portable/writeMinimalHwpx.mjs .tmp/ci-smoke/minimal.hwpx

      - name: Run Windows CLI portable smoke
        shell: pwsh
        env:
          HWPX_OPT_SMOKE_INPUT: .tmp/ci-smoke/minimal.hwpx
          HWPX_OPT_SMOKE_MODE: balanced
        run: npm run release:verify-cli-portable-smoke

      - name: Upload CLI portable ZIP
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact == true)
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-opt-win-x64
          path: |
            release/hwpx-opt-win-x64.zip
            release/hwpx-opt-win-x64.SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload full release metadata
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact == true)
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-opt-win-x64-metadata
          path: |
            release/release-manifest.json
            release/SHA256SUMS.txt
            release/RELEASE_NOTICE_*.txt
          if-no-files-found: error
