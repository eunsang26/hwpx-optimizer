name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated Windows installer artifact"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Windows release gate
        run: npm run release:check:win:ci

      - name: Measure synthetic desktop processing and save gaps
        run: node scripts/bench/measure-desktop-cancellation.mjs

      - name: Measure quick and deep analysis with synthetic images
        run: node scripts/bench/measure-analysis-modes.mjs

      - name: Measure synthetic ZIP, cache and worker resource limits
        run: node scripts/bench/measure-resource-limits.mjs

      - name: Upload installer artifact
        if: github.event_name == 'push' || inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-windows-installer
          path: release/*.exe
          if-no-files-found: error
