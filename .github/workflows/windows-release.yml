name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated Windows installer artifact"
        required: false
        default: false
        type: boolean
      build_tauri_poc:
        description: "Build the Tauri + Node sidecar PoC instead of the Electron release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  windows-release:
    if: github.event_name == 'push' || inputs.build_tauri_poc != true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Windows release gate
        run: npm run release:check:win

      - name: Upload installer artifact
        if: github.event_name == 'push' || inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-windows-installer
          path: release/*.exe
          if-no-files-found: error

  tauri-poc-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_tauri_poc == true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Tauri tests
        run: npm test -- apps/tauri-desktop/test/tauriConfig.test.ts apps/tauri-desktop/test/sidecarBinary.test.ts apps/tauri-desktop/test/sidecarProtocol.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Build Tauri NSIS installer
        run: npm run tauri:build

      - name: Print Tauri artifact sizes
        shell: pwsh
        run: |
          $report = @()
          $paths = @(
            "apps/tauri-desktop/src-tauri/target/release/hwpx-tauri-desktop.exe",
            "apps/tauri-desktop/src-tauri/target/release/hwpx-sidecar.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              $item = Get-Item $path
              $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $report += "{0}`t{1:N0} bytes`tsha256:{2}" -f $item.FullName, $item.Length, $hash
            }
          }
          Get-ChildItem "apps/tauri-desktop/src-tauri/target/release/bundle" -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $report += "{0}`t{1:N0} bytes`tsha256:{2}" -f $_.FullName, $_.Length, $hash
            }
          $report | Tee-Object -FilePath "apps/tauri-desktop/src-tauri/target/release/tauri-size-report.txt"

      - name: Upload Tauri installer artifact
        id: upload-tauri-installer
        if: inputs.upload_artifact == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-tauri-nsis
          path: apps/tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Report skipped Tauri artifact publication
        if: inputs.upload_artifact == true && steps.upload-tauri-installer.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "Tauri installer artifact upload failed. The Windows build remains valid; rerun after GitHub Actions artifact quota is available to publish a downloadable installer."
