name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated Windows installer artifact"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Windows release gate
        run: npm run release:check:win:ci

      - name: Verify packaged desktop with bundled fonts offline on a clean profile
        run: npm run desktop:smoke:packaged:win

      - name: Measure synthetic desktop processing and save gaps
        run: node scripts/bench/measure-desktop-cancellation.mjs

      - name: Measure quick and deep analysis with synthetic images
        run: node scripts/bench/measure-analysis-modes.mjs

      - name: Measure synthetic ZIP, cache and worker resource limits
        run: node scripts/bench/measure-resource-limits.mjs

      - name: Measure synthetic estimated versus actual sizes and strict target boundaries
        run: node scripts/bench/measure-size-estimates.mjs

      - name: Upload installer artifact
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_artifact == true)
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-windows-installer
          path: release/*.exe
          if-no-files-found: error
