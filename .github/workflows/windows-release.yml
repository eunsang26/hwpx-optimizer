name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the generated Windows installer artifact"
        required: false
        default: false
        type: boolean
      build_tauri_poc:
        description: "Build the Tauri + Node sidecar PoC instead of the Electron release"
        required: false
        default: false
        type: boolean
      publish_tauri_portable:
        description: "Publish the generated Tauri portable ZIP to a temporary GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    if: github.event_name == 'push' || inputs.build_tauri_poc != true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Windows release gate
        run: npm run release:check:win

      - name: Upload installer artifact
        if: github.event_name == 'push' || inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-windows-installer
          path: release/*.exe
          if-no-files-found: error

  tauri-poc-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_tauri_poc == true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Tauri tests
        run: npm test -- apps/tauri-desktop/test/tauriConfig.test.ts apps/tauri-desktop/test/sidecarBinary.test.ts apps/tauri-desktop/test/sidecarProtocol.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Build Tauri NSIS installer
        run: npm run tauri:build

      - name: Print Tauri artifact sizes
        shell: pwsh
        run: |
          $report = @()
          $paths = @(
            "apps/tauri-desktop/src-tauri/target/release/hwpx-tauri-desktop.exe",
            "apps/tauri-desktop/src-tauri/target/release/hwpx-sidecar.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              $item = Get-Item $path
              $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $report += "{0}`t{1:N0} bytes`tsha256:{2}" -f $item.FullName, $item.Length, $hash
            }
          }
          Get-ChildItem "apps/tauri-desktop/src-tauri/target/release/bundle" -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $report += "{0}`t{1:N0} bytes`tsha256:{2}" -f $_.FullName, $_.Length, $hash
            }
          $report | Tee-Object -FilePath "apps/tauri-desktop/src-tauri/target/release/tauri-size-report.txt"

      - name: Package Tauri portable folder
        shell: pwsh
        run: |
          $releaseDir = "apps/tauri-desktop/src-tauri/target/release"
          $portableDir = Join-Path $releaseDir "portable/HWPX Optimizer Tauri"
          $zipPath = Join-Path $releaseDir "HWPX-Optimizer-Tauri-Portable.zip"
          Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          Copy-Item -LiteralPath (Join-Path $releaseDir "hwpx-tauri-desktop.exe") -Destination (Join-Path $portableDir "HWPX Optimizer.exe")
          Copy-Item -LiteralPath (Join-Path $releaseDir "hwpx-sidecar.exe") -Destination (Join-Path $portableDir "hwpx-sidecar.exe")
          Copy-Item -LiteralPath (Join-Path $releaseDir "sidecar") -Destination (Join-Path $portableDir "sidecar") -Recurse
          Copy-Item -LiteralPath (Join-Path $releaseDir "node_modules") -Destination (Join-Path $portableDir "node_modules") -Recurse

          Compress-Archive -Path $portableDir -DestinationPath $zipPath -Force
          $zip = Get-Item $zipPath
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "{0}`t{1:N0} bytes`tsha256:{2}" -f $zip.FullName, $zip.Length, $hash | Tee-Object -FilePath (Join-Path $releaseDir "tauri-portable-report.txt")

      - name: Publish Tauri portable release asset
        if: inputs.publish_tauri_portable == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "tauri-portable-poc"
          $zipPath = "apps/tauri-desktop/src-tauri/target/release/HWPX-Optimizer-Tauri-Portable.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Tauri Portable PoC" --notes "Temporary portable Tauri build for manual validation." --prerelease
          }
          gh release upload $tag $zipPath --clobber

      - name: Upload Tauri installer artifact
        id: upload-tauri-installer
        if: inputs.upload_artifact == true
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hwpx-optimizer-tauri-nsis
          path: apps/tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Report skipped Tauri artifact publication
        if: inputs.upload_artifact == true && steps.upload-tauri-installer.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "Tauri installer artifact upload failed. The Windows build remains valid; rerun after GitHub Actions artifact quota is available to publish a downloadable installer."
