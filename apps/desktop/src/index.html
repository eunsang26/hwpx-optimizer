<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HWPX Optimizer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>HWPX Optimizer</h1>
          <p id="status-text">Ready.</p>
        </div>
        <button id="settings-button" class="ghost">Settings</button>
      </header>

      <section id="drop-zone" class="drop-zone">
        <div>
          <h2 id="file-name">Drop an HWPX file</h2>
          <p id="file-meta">No file selected.</p>
        </div>
        <div class="actions">
          <button id="choose-button">Choose File</button>
          <button id="analyze-button" disabled>Analyze</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Analysis</h2>
          <button id="output-button" class="ghost">Output Folder</button>
        </div>
        <div id="analysis-grid" class="metric-grid"></div>
      </section>

      <section class="panel modes">
        <div class="panel-header">
          <h2>Mode</h2>
          <p id="mode-warning"></p>
        </div>
        <label><input type="radio" name="mode" value="safe" checked /> Safe</label>
        <label><input type="radio" name="mode" value="balanced" /> Balanced</label>
        <label><input type="radio" name="mode" value="aggressive" /> Aggressive</label>
        <button id="optimize-button" disabled>Optimize</button>
      </section>

      <section id="progress-panel" class="panel progress-panel" hidden>
        <div class="panel-header">
          <h2>Progress</h2>
          <button id="cancel-button" class="ghost">Cancel</button>
        </div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-item">Waiting.</p>
      </section>

      <section class="panel two-column">
        <div>
          <h2>Opportunities</h2>
          <ul id="opportunity-list" class="list"></ul>
        </div>
        <div>
          <h2>Warnings</h2>
          <ul id="warning-list" class="list"></ul>
        </div>
      </section>

      <section id="result-panel" class="panel result" hidden>
        <div class="panel-header">
          <h2>Result</h2>
          <div class="actions">
            <button id="open-file-button" class="ghost">Open File</button>
            <button id="open-report-button" class="ghost" disabled>Open Report</button>
            <button id="open-folder-button" class="ghost">Show Folder</button>
          </div>
        </div>
        <div id="result-summary" class="metric-grid"></div>
        <p id="output-path"></p>
        <p id="report-path"></p>
      </section>

      <aside id="settings-panel" class="settings">
        <h2>Settings</h2>
        <label>
          Default mode
          <select id="setting-default-mode">
            <option value="safe">Safe</option>
            <option value="balanced">Balanced</option>
            <option value="aggressive">Aggressive</option>
          </select>
        </label>
        <label><input id="setting-save-next" type="checkbox" /> Save next to original</label>
        <label><input id="setting-save-report" type="checkbox" /> Save JSON report</label>
        <label><input id="setting-prevent-overwrite" type="checkbox" /> Prevent overwrite</label>
        <label><input id="setting-aggressive-warning" type="checkbox" /> Show aggressive warning</label>
        <p id="setting-output-directory">Output folder: original document folder</p>
        <div class="settings-actions">
          <button id="setting-output-button" class="ghost">Choose Output Folder</button>
          <button id="setting-output-reset-button" class="ghost">Use Original Folder</button>
        </div>
        <p>Settings are stored locally on this computer.</p>
      </aside>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
